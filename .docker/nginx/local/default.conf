# ------------------------------------------------------------
# LOCAL DEVELOPMENT NGINX (docker-compose only)
# ------------------------------------------------------------
# This file is used ONLY for local development.
# It acts as a reverse proxy:
#   /api     -> api container
#   /        -> client container
#
# Not used in:
# - Kubernetes (Traefik handles routing)
# - Production
# ------------------------------------------------------------

server {
    listen 80;
    server_name _;

    location ^~ /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location ^~ /swagger/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location = /swagger {
        return 301 $scheme://$http_host/swagger/;
    }
    
    location ^~ /hangfire/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
    
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }
            
    location = /hangfire {
            return 301 $scheme://$http_host/hangfire/;
        }
        
    location / {
        proxy_pass http://client:80;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}