services:
  db:
    image: postgres:18
    container_name: tubester-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: tubester
    ports:
      - "5432:5432"
    volumes:
      - youtubester_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tubester"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  youtubester_pgdata:
    external: true