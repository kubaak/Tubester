apiVersion: apps/v1
kind: Deployment
metadata:
  name: tubester-worker
  namespace: tubester
  labels:
    app: tubester-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tubester-worker
  template:
    metadata:
      labels:
        app: tubester-worker
    spec:
      imagePullSecrets:
        - name: ghcr-secret

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: worker
          image: ghcr.io/kubaak/tubester-worker:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080

          envFrom:
            - configMapRef:
                name: tubester-config
            - secretRef:
                name: tubester-api-secrets

          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi