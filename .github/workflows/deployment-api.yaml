name: Deploy backend

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/tubester-api
      IMAGE_TAG: sha-${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Run database migration
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: FULL_IMAGE
          script: |
            kubectl -n tubester delete job tubester-db-migration --ignore-not-found
            cat <<EOF | kubectl apply -f -
            apiVersion: batch/v1
            kind: Job
            metadata:
              name: tubester-db-migration
              namespace: tubester
            spec:
              backoffLimit: 3
              ttlSecondsAfterFinished: 300
              template:
                spec:
                  imagePullSecrets:
                    - name: ghcr-secret
                  containers:
                    - name: migration
                      image: ${FULL_IMAGE}
                      envFrom:
                        - secretRef:
                            name: tubester-api-secrets
                      command: ["./efbundle"]
                      args: ["--connection", "\$(ConnectionStrings__TubesterDb)"]
                  restartPolicy: Never
            EOF
            kubectl -n tubester wait --for=condition=complete --timeout=120s job/tubester-db-migration || \
              (echo "Migration failed. Logs:" && kubectl -n tubester logs job/tubester-db-migration && exit 1)
        env:
          FULL_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Deploy API
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: FULL_IMAGE
          script: |
            kubectl -n tubester set image deployment/tubester-api api=${FULL_IMAGE}
            kubectl -n tubester rollout status deployment/tubester-api
        env:
          FULL_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
